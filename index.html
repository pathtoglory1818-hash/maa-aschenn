<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মা আসছেন - Durga Puja Pandal Explorer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet CSS & JS (Open Source Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Noto Serif Bengali"', 'serif'],
                    },
                    colors: {
                        puja: {
                            red: '#B91C1C',
                            darkRed: '#7F1D1D',
                            gold: '#FBBF24',
                            darkGold: '#D97706',
                            cream: '#FFFBEB',
                            route: '#EA580C'
                        }
                    },
                    boxShadow: {
                        '3d': '0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2)',
                        'glow': '0 0 15px rgba(251, 191, 36, 0.6)'
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FFFBEB; overflow: hidden; }
        .font-bengali { font-family: 'Noto Serif Bengali', serif; }
        
        /* Leaflet Overrides */
        .leaflet-control-container .leaflet-routing-container { display: none; }
        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 0; }
        .leaflet-popup-close-button { top: 8px !important; right: 8px !important; color: #999 !important; }
        .custom-div-icon { background: transparent; border: none; }

        /* Marker Styles */
        .marker-container {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .marker-container:hover { transform: scale(1.15) translateY(-5px); z-index: 1000 !important; }
        .marker-emoji {
            line-height: 1;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.5)) drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
        }
        .marker-selected {
            transform: scale(1.25);
            z-index: 900 !important;
        }
        .marker-selected .marker-emoji {
            filter: drop-shadow(0px 0px 12px rgba(251, 191, 36, 0.9)) drop-shadow(0px 8px 6px rgba(0,0,0,0.5));
        }
        
        /* User Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .user-pulse::before {
            content: '';
            position: absolute;
            inset: -10px;
            background-color: rgba(234, 88, 12, 0.4);
            border-radius: 50%;
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: -1;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Mobile layout transitions */
        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        /* Mobile viewport fix */
        .h-screen-fix {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>

    <div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 transition-all"></div>

    <script>
        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://tehvtftiwlsrasatibwp.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_BfHQCR5x4NzHqimkCJTmOQ_36TccGzw'; 

        // --- DATA ---
        let PANDALS = [
            { id: "pandal-1", name: "Aneek sangha", lat: 24.9999125, lng: 88.1387031, description: "Beautiful traditional pandal in Malda." },
            { id: "pandal-2", name: "Pandal Name 2", lat: 25.0006875, lng: 88.1343125, description: "Popular local gathering spot." }
        ];

        let WASHROOMS = [
            { id: "w-1", name: "Public Restroom (Malda)", lat: 25.0002, lng: 88.1360 }
        ];

        const DEFAULT_CENTER = { lat: 25.0003, lng: 88.1365 }; // Malda center

        // Initialize Supabase Client
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        async function loadLiveData() {
            if (!supabaseClient) return;
            try {
                const { data: pandalData, error: pErr } = await supabaseClient.from('pandals').select('*');
                if (!pErr && pandalData && pandalData.length > 0) PANDALS = pandalData;

                const { data: washData, error: wErr } = await supabaseClient.from('washrooms').select('*');
                if (!wErr && washData && washData.length > 0) WASHROOMS = washData;
                
                if (PANDALS.length > 0) showToast("Live map data synced automatically!", "info");
            } catch (err) {
                console.error("Supabase Error:", err);
                showToast("Couldn't connect to database, using offline mode.", "error");
            }
        }

        // --- STATE ---
        let state = {
            selectedPandals: new Set(),
            searchQuery: "",
            showPandals: true,
            showWashrooms: false,
            userLocation: null,
            routeInfo: null,
            isMobileSheetOpen: false
        };

        // --- LEAFLET MAP OBJECTS ---
        let map;
        let markers = { pandals: {}, washrooms: {}, user: null };
        let routeLayer = null;

        // --- UTILITIES ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-red-100 text-red-800 border-red-200' : 'bg-white text-gray-800 border-gray-200 shadow-xl';
            toast.className = `px-6 py-3 rounded-xl border font-medium text-sm transition-all duration-300 transform translate-y-[-100%] opacity-0 flex items-center gap-3 z-50 ${colors}`;
            toast.innerHTML = type === 'error' ? `<span>⚠️</span> ${message}` : `<span>ℹ️</span> ${message}`;
            document.getElementById('toast-container').appendChild(toast);
            requestAnimationFrame(() => { toast.style.transform = 'translateY(0)'; toast.style.opacity = '1'; });
            setTimeout(() => {
                toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- MAP INITIALIZATION ---
        async function initMap() {
            await loadLiveData();

            // Initialize Leaflet Map
            map = L.map('map', { zoomControl: false }).setView([DEFAULT_CENTER.lat, DEFAULT_CENTER.lng], 13);
            
            // ESRI WORLD STREET MAP - Extremely reliable, beautiful, no API keys, no 403 blocks!
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }).addTo(map);

            document.getElementById('map-loading').style.opacity = '0';
            setTimeout(() => document.getElementById('map-loading').style.display = 'none', 500);

            updateMarkers();
            renderPandalList();
            setTimeout(requestLocation, 1500);
        }

        // Custom Leaflet Icons
        function getCustomIcon(emoji, sizePx) {
            return L.divIcon({
                html: `<div class="marker-container"><div class="marker-emoji" style="font-size: ${sizePx}px;">${emoji}</div></div>`,
                className: 'custom-div-icon',
                iconSize: [sizePx, sizePx],
                iconAnchor: [sizePx/2, sizePx],
                popupAnchor: [0, -sizePx]
            });
        }

        function getUserIcon() {
            return L.divIcon({
                html: `<div class="marker-container user-pulse"><div class="bg-white rounded-full p-1 shadow-xl border-2 border-puja-route"><div class="marker-emoji" style="font-size: 24px;">🧍</div></div></div>`,
                className: 'custom-div-icon',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        }

        function updateMarkers() {
            if (!map) return;

            // PANDALS
            PANDALS.forEach(pandal => {
                const isSel = state.selectedPandals.has(pandal.id);
                if (!markers.pandals[pandal.id]) {
                    const icon = getCustomIcon('🪷', 46);
                    const marker = L.marker([pandal.lat, pandal.lng], { icon: icon });
                    
                    const popupHtml = `
                        <div style="padding: 12px 6px; font-family: 'Inter', sans-serif; text-align: center; width: 180px;">
                            <h3 style="margin:0 0 6px 0; color: #B91C1C; font-weight: 700; font-size: 15px;">${pandal.name}</h3>
                            <p style="margin:0 0 12px 0; font-size: 12px; color: #555; line-height: 1.3;">${pandal.description || ''}</p>
                            <button onclick="togglePandal('${pandal.id}'); map.closePopup();" style="background: ${isSel ? '#f3f4f6' : '#B91C1C'}; color: ${isSel ? '#374151' : '#fff'}; border: ${isSel ? '1px solid #d1d5db' : 'none'}; padding: 8px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 13px; transition: all 0.2s;">
                                ${isSel ? 'Remove from Route' : 'Add to Route'}
                            </button>
                        </div>
                    `;
                    marker.bindPopup(popupHtml);
                    
                    if (state.showPandals) marker.addTo(map);
                    markers.pandals[pandal.id] = { marker, isAdded: state.showPandals };
                } else {
                    const obj = markers.pandals[pandal.id];
                    
                    // Update visual selected state
                    let html = `<div class="marker-container ${isSel ? 'marker-selected' : ''}"><div class="marker-emoji" style="font-size: 46px;">🪷</div></div>`;
                    obj.marker.setIcon(L.divIcon({ html, className: 'custom-div-icon', iconSize: [46, 46], iconAnchor: [23, 46], popupAnchor: [0, -46] }));

                    if (state.showPandals && !obj.isAdded) { obj.marker.addTo(map); obj.isAdded = true; }
                    if (!state.showPandals && obj.isAdded) { map.removeLayer(obj.marker); obj.isAdded = false; }
                }
            });

            // WASHROOMS
            WASHROOMS.forEach(w => {
                if (!markers.washrooms[w.id]) {
                    const marker = L.marker([w.lat, w.lng], { icon: getCustomIcon('🚽', 34) });
                    marker.bindPopup(`<div style="padding:8px;font-weight:600;color:#1e40af;font-family:'Inter',sans-serif;">🚽 ${w.name}</div>`);
                    if (state.showWashrooms) marker.addTo(map);
                    markers.washrooms[w.id] = { marker, isAdded: state.showWashrooms };
                } else {
                    const obj = markers.washrooms[w.id];
                    if (state.showWashrooms && !obj.isAdded) { obj.marker.addTo(map); obj.isAdded = true; }
                    if (!state.showWashrooms && obj.isAdded) { map.removeLayer(obj.marker); obj.isAdded = false; }
                }
            });

            // USER
            if (state.userLocation) {
                if (!markers.user) {
                    markers.user = L.marker([state.userLocation.lat, state.userLocation.lng], { icon: getUserIcon(), zIndexOffset: 1000 }).addTo(map);
                } else {
                    markers.user.setLatLng([state.userLocation.lat, state.userLocation.lng]);
                }
            }
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    updateMarkers();
                    if(map) {
                        map.setView([state.userLocation.lat, state.userLocation.lng], 14, {animate: true});
                    }
                },
                (err) => {
                    showToast("Location access denied. Please enable it for routing from your current spot.", "info");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        window.togglePandal = function(id) {
            if (state.selectedPandals.has(id)) {
                state.selectedPandals.delete(id);
            } else {
                state.selectedPandals.add(id);
                const p = PANDALS.find(x => x.id === id);
                if (p && map && window.innerWidth > 768) {
                    map.setView([p.lat, p.lng], 15, {animate: true});
                }
            }
            updateMarkers();
            renderPandalList();
            updateBottomButton();
        }

        function optimizeRouteOrder(startLoc, pandalDataList) {
            let unvisited = [...pandalDataList];
            let curr = startLoc;
            let ordered = [];
            while(unvisited.length > 0) {
                let nearestIdx = 0, minDist = Infinity;
                for(let i=0; i<unvisited.length; i++) {
                    const d = calcDist(curr.lat, curr.lng, unvisited[i].lat, unvisited[i].lng);
                    if(d < minDist) { minDist = d; nearestIdx = i; }
                }
                const next = unvisited.splice(nearestIdx, 1)[0];
                ordered.push(next);
                curr = { lat: next.lat, lng: next.lng };
            }
            return ordered;
        }

        // --- NEW INSTANT GOOGLE MAPS ROUTER ---
        async function planRoute() {
            if (!state.userLocation) {
                showToast("Please allow location access to plan a route from your spot.", "error");
                requestLocation();
                return;
            }
            if (state.selectedPandals.size === 0) return;

            setLoadingState(true);

            // 1. Optimize the sequence
            const selectedData = PANDALS.filter(p => state.selectedPandals.has(p.id));
            const optimized = optimizeRouteOrder(state.userLocation, selectedData);

            // 2. Draw a quick dashed line on our map for visual reference
            if (routeLayer) map.removeLayer(routeLayer);
            const latlngs = [state.userLocation, ...optimized.map(p => [p.lat, p.lng])];
            
            routeLayer = L.polyline(latlngs, {
                color: '#EA580C', 
                weight: 6, 
                opacity: 0.7, 
                dashArray: '10, 10',
                lineCap: 'round'
            }).addTo(map);
            
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            // 3. Build the Google Maps Navigation URL instantly
            const origin = `${state.userLocation.lat},${state.userLocation.lng}`;
            const dest = optimized[optimized.length - 1];
            const destination = `${dest.lat},${dest.lng}`;

            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
            if (optimized.length > 1) {
                const waypoints = optimized.slice(0, -1).map(p => `${p.lat},${p.lng}`).join('|');
                url += `&waypoints=${waypoints}`;
            }

            // 4. Update the UI to show the route plan summary
            state.routeInfo = {
                sequence: optimized,
                googleMapsUrl: url
            };

            renderRouteSummary();
            showRouteView();
            if(window.innerWidth < 768) toggleMobileSheet(false);

            // 5. Instantly open Google Maps for actual navigation
            setTimeout(() => {
                window.open(url, '_blank');
                setLoadingState(false);
            }, 300); // Tiny delay to let the UI update first
        }

        window.openGoogleMaps = function() {
            if (state.routeInfo && state.routeInfo.googleMapsUrl) {
                window.open(state.routeInfo.googleMapsUrl, '_blank');
            }
        };

        window.clearRoute = function() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            state.routeInfo = null;
            state.selectedPandals.clear();
            updateMarkers();
            renderPandalList();
            updateBottomButton();
            showListView();
            if(map && state.userLocation) {
                map.setView([state.userLocation.lat, state.userLocation.lng], 13, {animate: true});
            }
        }

        function renderPandalList() {
            const q = state.searchQuery.toLowerCase();
            const filtered = PANDALS.filter(p => p.name.toLowerCase().includes(q));
            const listEl = document.getElementById('pandal-list');
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-400 py-10">No pandals found matching "${q}".</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(p => {
                const isSel = state.selectedPandals.has(p.id);
                return `
                    <div onclick="togglePandal('${p.id}')" class="cursor-pointer p-4 rounded-2xl border-2 transition-all duration-300 flex items-center gap-4 ${isSel ? 'border-puja-gold bg-amber-50/50 shadow-[0_4px_15px_rgba(251,191,36,0.15)] scale-[1.01]' : 'border-transparent bg-white shadow-sm hover:shadow-md hover:bg-gray-50'}">
                        <div class="text-3xl drop-shadow-sm filter transition-transform ${isSel ? 'scale-110' : ''}">🪷</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-base ${isSel ? 'text-puja-red' : 'text-gray-800'}">${p.name}</h3>
                            <p class="text-xs text-gray-500 line-clamp-1 mt-0.5">${p.description || ''}</p>
                        </div>
                        <div class="w-7 h-7 rounded-full flex items-center justify-center border-2 transition-all duration-300 ${isSel ? 'bg-puja-red border-puja-red text-white shadow-md' : 'border-gray-300 text-transparent'}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRouteSummary() {
            if(!state.routeInfo) return;
            
            let html = `
                <div class="absolute left-[23px] top-8 bottom-8 w-1 bg-gradient-to-b from-puja-red via-puja-route to-puja-gold opacity-30 rounded-full z-0"></div>
                <div class="flex items-center gap-4 relative z-10 py-4">
                    <div class="w-12 h-12 rounded-full bg-blue-100 border-4 border-white shadow-md flex items-center justify-center text-blue-700 text-xl z-10 relative">🧍</div>
                    <div class="font-bold text-gray-800 text-lg">Your Location</div>
                </div>
            `;

            state.routeInfo.sequence.forEach((p, idx) => {
                html += `
                    <div class="flex items-start gap-4 relative z-10 py-3">
                        <div class="w-12 h-12 rounded-full bg-white border-4 border-puja-red flex items-center justify-center shadow-md font-bold text-puja-red text-lg z-10 relative">
                            ${idx + 1}
                        </div>
                        <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 group hover:shadow-md transition-shadow">
                            <div class="font-bold text-gray-800 text-base mb-1">${p.name}</div>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="mt-6 pt-4 border-t border-gray-100 flex flex-col gap-3">
                    <button onclick="openGoogleMaps()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold rounded-2xl transition-all shadow-lg flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        Re-open in Google Maps
                    </button>
                    <button onclick="clearRoute()" class="w-full py-4 bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 font-bold rounded-2xl transition-colors border border-gray-200">
                        Clear Route & Start Over
                    </button>
                </div>
            `;
            document.getElementById('route-steps').innerHTML = html;
        }

        function updateBottomButton() {
            const count = state.selectedPandals.size;
            const btn = document.getElementById('planRouteBtn');
            const txt = document.getElementById('planRouteText');
            const nav = document.getElementById('btn-icon-nav');
            
            if (count > 0) {
                btn.disabled = false;
                btn.className = "w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl transition-all transform hover:-translate-y-1 bg-gradient-to-r from-puja-red to-puja-darkRed text-white hover:shadow-2xl";
                txt.textContent = `Open in Google Maps (${count} stops)`;
                nav.classList.remove('hidden');
            } else {
                btn.disabled = true;
                btn.className = "w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm transition-all bg-gray-100 text-gray-400 cursor-not-allowed";
                txt.textContent = "Select Pandals to Plan";
                nav.classList.remove('hidden');
            }
        }

        function setLoadingState(isLoading) {
            const btn = document.getElementById('planRouteBtn');
            const nav = document.getElementById('btn-icon-nav');
            const load = document.getElementById('btn-icon-load');
            const txt = document.getElementById('planRouteText');
            
            if(isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-80');
                nav.classList.add('hidden');
                load.classList.remove('hidden');
                txt.textContent = "Opening Maps...";
            } else {
                updateBottomButton();
                load.classList.add('hidden');
            }
        }

        function showRouteView() {
            document.getElementById('list-view').classList.add('hidden');
            const routeView = document.getElementById('route-view');
            routeView.classList.remove('hidden');
            routeView.classList.add('flex');
        }

        function showListView() {
            const routeView = document.getElementById('route-view');
            routeView.classList.add('hidden');
            routeView.classList.remove('flex');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function toggleMobileSheet(forceState) {
            const willOpen = forceState !== undefined ? forceState : !state.isMobileSheetOpen;
            state.isMobileSheetOpen = willOpen;
            const sidebar = document.getElementById('sidebar');
            const iconList = document.getElementById('icon-list');
            const iconMap = document.getElementById('icon-map');
            
            if (willOpen) {
                sidebar.classList.remove('translate-y-[calc(100%-48px)]');
                sidebar.classList.add('translate-y-0');
                iconList.classList.add('hidden');
                iconMap.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-y-[calc(100%-48px)]');
                sidebar.classList.remove('translate-y-0');
                iconMap.classList.add('hidden');
                iconList.classList.remove('hidden');
            }
        }

        // EVENT LISTENERS
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderPandalList();
        });

        document.getElementById('togglePandals').addEventListener('click', () => {
            state.showPandals = !state.showPandals;
            const btn = document.getElementById('togglePandals');
            const eye = document.getElementById('eye-off-pandals');
            if(state.showPandals) {
                btn.classList.add('bg-red-50/80', 'text-red-600');
                btn.classList.remove('text-gray-400', 'hover:bg-gray-50/80');
                eye.classList.add('hidden');
            } else {
                btn.classList.remove('bg-red-50/80', 'text-red-600');
                btn.classList.add('text-gray-400', 'hover:bg-gray-50/80');
                eye.classList.remove('hidden');
            }
            updateMarkers();
        });

        document.getElementById('toggleWashrooms').addEventListener('click', () => {
            state.showWashrooms = !state.showWashrooms;
            const btn = document.getElementById('toggleWashrooms');
            const eye = document.getElementById('eye-off-washrooms');
            const icon = document.getElementById('washroom-icon');
            if(state.showWashrooms) {
                btn.classList.add('hover:bg-gray-50/80', 'text-blue-600');
                btn.classList.remove('text-gray-400', 'hover:bg-gray-50/80');
                icon.classList.remove('grayscale', 'opacity-50');
                eye.classList.add('hidden');
            } else {
                btn.classList.remove('hover:bg-gray-50/80', 'text-blue-600');
                btn.classList.add('text-gray-400', 'hover:bg-gray-50/80');
                icon.classList.add('grayscale', 'opacity-50');
                eye.classList.remove('hidden');
            }
            updateMarkers();
        });

        document.getElementById('locateUser').addEventListener('click', requestLocation);
        document.getElementById('planRouteBtn').addEventListener('click', planRoute);
        document.getElementById('closeRouteBtn').addEventListener('click', showListView);
        
        // Mobile Interactions
        document.getElementById('mobileToggleBtn').addEventListener('click', () => toggleMobileSheet());
        const dragHandle = document.getElementById('dragHandle');
        dragHandle.addEventListener('click', () => toggleMobileSheet());
        
        let touchStartY = 0;
        dragHandle.addEventListener('touchstart', e => touchStartY = e.changedTouches[0].screenY, {passive: true});
        dragHandle.addEventListener('touchend', e => {
            if (e.changedTouches[0].screenY > touchStartY + 30) toggleMobileSheet(false);
            if (e.changedTouches[0].screenY < touchStartY - 30) toggleMobileSheet(true);
        }, {passive: true});

        // Initialize Map
        window.addEventListener('load', initMap);

    </script>
</body>
</html>
